# ============================================================================
#  example.cfg — minimal runnable fdtd example (MoO3 phonon polariton / PhP)
#
#  Run the following in the repository root, in this order:
#     python3 generate_medium5.py examples/example.cfg medium_map.bin
#     mpicc -o fdtd.x fdtd.c -lm -lrt -Ofast
#     mpirun -np 4 ./fdtd.x examples/example.cfg > out.log 2>&1
#
#  Notes:
#   * Grid 80 x 80 x 48 with a 20 nm step; it models a small
#     400 nm x 400 nm x 180 nm MoO3 block excited by a ~930 cm⁻¹ dipole
#     source placed in the vacuum below the block.
#   * The size is deliberately small: it finishes in a few minutes and is meant
#     to verify the compilation, the data files and the post-processing chain.
#   * The configuration file is parsed line by line: a line starting with `#`
#     is a comment (trailing comments are NOT supported); `source` / `material`
#     lines must start in column 0 and must be written on a single line.
# ============================================================================

[grid]
nx = 80
ny = 80
nz = 48
delta_x = 20e-9
delta_y = 20e-9
delta_z = 20e-9
tsteps = 20000
# dt = 0.99·min(Δx,Δy,Δz)/(c√3) with c = 3e8, i.e. the three-dimensional CFL
# limit; the total duration is about 0.76 ps. fdtd.x falls back to this value
# when dt is omitted, but frequency_analysis must read dt explicitly to know the
# sampling interval (= output_interval·dt), so it is written out here; the value
# is exactly the automatic one.
dt = 3.8105117767e-17
pml_thickness = 8
pml_reflection = 1e-6
output_interval = 50
output_component = Ez
output_slice_axis = z
output_slice_position = 30

# ---------------------------------------------------------------------------
# Excitation source: a dipole with a main frequency of 930 cm⁻¹, placed in the
# vacuum below the MoO3 block.
# Note: the frequency of the first source line is used as
#       unique_source_frequency — it selects the row of the dielectric= table
#       and is used to compute the ADE coefficients of use_ADE materials.
# ---------------------------------------------------------------------------
source type=dipole, x=40,y=40,z=12, amplitude=1.0, wavenumber=930, component=x, t0=0.05e-12, tau=0.015e-12

# ---------------------------------------------------------------------------
# Medium geometry: only generate_medium5.py reads this section.
# Material ids 0-3 are built into the program; custom materials must start at 4.
# ---------------------------------------------------------------------------
[medium]
# MoO3 block with x,y ∈ [30,49] and z ∈ [16,24] (everything else is vacuum)
cubes = [ {"xrange": (30, 49), "yrange": (30, 49), "zrange": (16, 24), "material": 4} ]

# ---------------------------------------------------------------------------
# Material 4: MoO3 — a phonon-polariton material
#   born  = VASP OUTCAR fragment (reads the Born effective charges and
#           overwrites eps_* with its MACROSCOPIC STATIC DIELECTRIC TENSOR)
#   QeZV  = Z*e/Ω  , unit C/m^3, 9*natom numbers in total
#   QeZM  = Z*e/M  , unit C/kg , 9*natom numbers in total (note: the MoO3
#           directory uses a lowercase m in that file name)
#   DMM   = mass-weighted dynamical matrix, unit s^-2, 9*natom^2 numbers in total
# Note: for PhP calculations the eps in the constitutive relation
#       E = (D - P_ion)/(eps0*eps_inf) should in principle be the high-frequency
#       (clamped-ion) dielectric tensor eps_inf; taking it from
#       born=OUTCAR.txt here substitutes the static tensor instead — see
#       section 5.3 "Material" in the README for details.
# ---------------------------------------------------------------------------
material id=4, name=MoO3, natom=16, born=Material_data/MoO3/OUTCAR.txt, QeZV=Material_data/MoO3/QeZV_clean.txt, QeZM=Material_data/MoO3/QeZm_clean.txt, DMM=Material_data/MoO3/DMM_clean.txt

# ---------------------------------------------------------------------------
# Material 5 (optional, commented out by default): describes MoO3 with a
# dielectric function table only, without coupling the ionic motion.
# To enable it, change material to 5 in the cubes line above and regenerate
# medium_map.bin. Frequency bands in which the real part of the dielectric
# function is negative require use_ADE=1.
# ---------------------------------------------------------------------------
#material id=5, name=Lorentz_MoO3, dielectric=Lorentz_dielectric/dielectric_MoO3_Lorentz.txt, use_ADE=1, switchxz=1

# ---------------------------------------------------------------------------
# Miscellaneous
# ---------------------------------------------------------------------------
medium_file = ./medium_map.bin
# The monitor point lies on a material that contains atoms, so full_monitor is
# enabled automatically (displacements/velocities of all atoms are written)
monitor_point = x=40,y=40,z=20,atom=0,dir=z
monitor_output_file = monitor_point.dat
full_monitor = 1
full_monitor_output_file = full_monitor.dat
